<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Archana AI — Blood Crystal Premium Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       DESIGN SYSTEM: BLOOD CRYSTAL LUXURY
       ========================================================================== */
    :root {
      --bg-void: #050102;
      --bg-surface: rgba(18, 5, 8, 0.75);
      --bg-surface-glow: rgba(35, 8, 14, 0.85);
      --accent-blood: #e60039;
      --accent-crimson: #ff1a53;
      --accent-fire: #ff4d6d;
      --gold-sparkle: #ffd700;
      --text-pure: #ffffff;
      --text-main: #fce8e9;
      --text-muted: #a67c83;
      --border-blood: rgba(230, 0, 57, 0.4);
      --border-sparkle: rgba(255, 215, 0, 0.3);
      --glass-blur: blur(20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-void);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .blood-aura {
      position: absolute;
      top: -25%;
      left: 50%;
      transform: translateX(-50%);
      width: 140vw;
      height: 700px;
      background: radial-gradient(circle, rgba(230, 0, 57, 0.28) 0%, rgba(255, 26, 83, 0.08) 45%, rgba(5, 1, 2, 0) 70%);
      z-index: 0;
      pointer-events: none;
      animation: auraPulse 7s infinite alternate ease-in-out;
    }

    @keyframes auraPulse {
      0% { opacity: 0.5; transform: translateX(-50%) scale(0.92); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    }

    /* Particle Bling-Bling Canvas */
    #sparkle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* SVG Icon Styling */
    .svg-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
    }

    /* ==========================================================================
       HEADER & MODEL SELECTOR
       ========================================================================== */
    .app-header {
      z-index: 10;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      background: rgba(5, 1, 2, 0.75);
      border-bottom: 1px solid var(--border-blood);
      box-shadow: 0 4px 30px rgba(230, 0, 57, 0.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-gem {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #ff1a53, #800020);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(255, 26, 83, 0.6), inset 0 0 10px rgba(255, 215, 0, 0.5);
      border: 1px solid rgba(255, 215, 0, 0.6);
      animation: gemShimmer 3s infinite alternate;
    }

    @keyframes gemShimmer {
      0% { filter: drop-shadow(0 0 5px rgba(255, 26, 83, 0.8)); }
      100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9)); }
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: 2.5px;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #ffffff 0%, #ff809b 50%, var(--accent-crimson) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(230, 0, 57, 0.3);
    }

    .model-selector {
      position: relative;
    }

    .model-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(30, 6, 12, 0.9), rgba(50, 10, 20, 0.9));
      border: 1px solid var(--accent-blood);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-pure);
      box-shadow: 0 0 15px rgba(230, 0, 57, 0.35), inset 0 0 8px rgba(255, 26, 83, 0.2);
      cursor: pointer;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-crimson);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-crimson), 0 0 20px var(--accent-crimson);
      animation: pulseBlink 1.5s infinite alternate;
    }

    @keyframes pulseBlink { 100% { opacity: 0.3; } }

    /* ==========================================================================
       CHAT AREA & MESSAGES
       ========================================================================== */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    #chat-container::-webkit-scrollbar {
      width: 5px;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background: var(--border-blood);
      border-radius: 10px;
    }

    .welcome-card {
      margin: auto;
      text-align: center;
      padding: 36px 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border-blood);
      border-radius: 24px;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      max-width: 380px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(230, 0, 57, 0.2);
      animation: fadeIn 0.6s ease-out;
    }

    .welcome-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--accent-blood), var(--gold-sparkle));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 26, 83, 0.7);
    }

    .welcome-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }

    .welcome-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.5;
    }

    .msg {
      max-width: 85%;
      padding: 16px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
      animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #e60039 0%, #a00028 100%);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 20px rgba(230, 0, 57, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--bg-surface);
      border: 1px solid var(--border-blood);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom-left-radius: 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(230, 0, 57, 0.1);
    }

    .msg.ai::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-crimson), transparent);
    }

    /* ==========================================================================
       INPUT & ATTACHMENT AREA
       ========================================================================== */
    .input-container {
      z-index: 10;
      padding: 14px 18px 20px;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      background: rgba(5, 1, 2, 0.85);
      border-top: 1px solid var(--border-blood);
    }

    .attachment-preview-area {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      overflow-x: auto;
    }

    .attach-tag {
      background: rgba(230, 0, 57, 0.2);
      border: 1px solid var(--accent-blood);
      color: var(--text-main);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface-glow);
      border: 1px solid var(--border-blood);
      border-radius: 20px;
      padding: 6px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(230, 0, 57, 0.15);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-box:focus-within {
      border-color: var(--accent-crimson);
      box-shadow: 0 0 20px rgba(255, 26, 83, 0.5), inset 0 0 15px rgba(230, 0, 57, 0.25);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px 0;
      resize: none;
      outline: none;
      max-height: 120px;
      font-size: 0.95rem;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }

    .icon-btn:hover {
      color: var(--accent-crimson);
      background: rgba(230, 0, 57, 0.15);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-crimson), #990026);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #fff;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(230, 0, 57, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 26, 83, 0.9);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Canvas Sparkle Effect -->
  <canvas id="sparkle-canvas"></canvas>
  <div class="blood-aura"></div>

  <!-- Header Section -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-gem">
        <svg class="svg-icon" viewBox="0 0 24 24" style="color: #fff;">
          <path d="M12 2L2 9l10 13 10-13-10-7zm0 3.8L18.6 9 12 17.6 5.4 9 12 5.8z"/>
        </svg>
      </div>
      <span class="brand-title">ARCHANA</span>
    </div>

    <!-- Model Selector -->
    <div class="model-selector">
      <div class="model-pill">
        <span class="status-dot"></span>
        <span>Archana (beta)</span>
        <svg class="svg-icon" viewBox="0 0 24 24" style="width: 14px; height: 14px;">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- Chat Container -->
  <main id="chat-container">
    <div class="welcome-card">
      <div class="welcome-icon">
        <svg class="svg-icon" viewBox="0 0 24 24" style="width: 32px; height: 32px; color: #fff;">
          <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
      </div>
      <h2>Selamat Datang</h2>
      <p>Saya <b>Archana</b>. Silakan ajukan pertanyaan atau lampirkan dokumen/gambar untuk memulai percakapan.</p>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="input-container">
    <div id="attachment-preview" class="attachment-preview-area"></div>
    <div class="input-box">
      <label for="file-input" class="icon-btn" title="Lampirkan File">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 015 0v10.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5V6H9v9.5a3 3 0 006 0V5a4 4 0 00-8 0v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
        </svg>
        <input type="file" id="file-input" hidden>
      </label>
      <textarea id="user-input" rows="1" placeholder="Bicara dengan Archana..."></textarea>
      <button id="send-btn" class="send-btn">
        <span>Kirim</span>
        <svg class="svg-icon" viewBox="0 0 24 24" style="width: 16px; height: 16px;">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </footer>

  <script>
    /* ==========================================================================
       CANVAS SPARKLE / BLING-BLING ANIMATION
       ========================================================================== */
    const canvas = document.getElementById('sparkle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Sparkle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.alpha = Math.random();
        this.speed = Math.random() * 0.02 + 0.005;
        this.color = Math.random() > 0.3 ? '#ff1a53' : '#ffd700';
      }
      update() {
        this.alpha += this.speed;
        if (this.alpha > 1 || this.alpha < 0) {
          this.speed = -this.speed;
        }
        if (this.alpha < 0) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new Sparkle());
    }

    function animateSparkles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateSparkles);
    }
    animateSparkles();

    /* ==========================================================================
       FRONTEND LOGIC & CHAT STREAMING
       ========================================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      const chatContainer = document.getElementById("chat-container");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const fileInput = document.getElementById("file-input");
      const attachmentPreview = document.getElementById("attachment-preview");

      let currentChatId = null;
      let currentAttachments = [];

      userInput.addEventListener("input", () => {
        userInput.style.height = "auto";
        userInput.style.height = Math.min(userInput.scrollHeight, 120) + "px";
      });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch("/api/upload", { method: "POST", body: formData });
          const data = await res.json();
          if (data.ok) {
            currentAttachments.push(data.file_id);
            attachmentPreview.innerHTML = `<span class="attach-tag">📎 ${data.name}</span>`;
          }
        } catch (err) {
          alert("Gagal mengunggah file.");
        }
      });

      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text && !currentAttachments.length) return;

        const welcomeCard = document.querySelector(".welcome-card");
        if (welcomeCard) welcomeCard.remove();

        appendBubble("user", text || "[Lampiran File]");
        userInput.value = "";
        userInput.style.height = "auto";

        const aiBubble = appendBubble("ai", "...");

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              prompt: text,
              chatId: currentChatId,
              attachments: currentAttachments
            })
          });

          currentAttachments = [];
          attachmentPreview.innerHTML = "";

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let fullText = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split("\n");

            for (const line of lines) {
              if (line.startsWith("data:")) {
                const jsonStr = line.slice(5).trim();
                if (!jsonStr) continue;
                try {
                  const ev = JSON.parse(jsonStr);
                  if (ev.type === "chat_meta") currentChatId = ev.chat_id;
                  if (ev.type === "delta") {
                    fullText += ev.chunk;
                    aiBubble.textContent = fullText;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                  }
                } catch (e) {}
              }
            }
          }
        } catch (err) {
          aiBubble.textContent = "Terjadi kesalahan koneksi.";
        }
      }

      function appendBubble(sender, text) {
        const div = document.createElement("div");
        div.className = `msg ${sender}`;
        div.textContent = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
      }

      sendBtn.addEventListener("click", sendMessage);
      userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    });
  </script>
</body>
</html>
